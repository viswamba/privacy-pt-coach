[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-pt-coach"
version = "0.1.0"
description = "Privacy-first local computer-vision prototype for movement coaching."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Viswanath Chilakala" }
]
dependencies = [
  "mediapipe>=0.10.14,<0.11",
  "opencv-python>=4.9,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[project.scripts]
privacy-pt-demo = "privacy_pt_coach.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
